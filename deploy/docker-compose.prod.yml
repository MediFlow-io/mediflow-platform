# Production settings on top of ../docker-compose.yml. Used by deploy/install.sh:
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
# Every secret comes from deploy/.env, which install.sh generates and which is never committed.
# PUBLIC_HOST is the server's public IP or domain name.

x-restart: &restart
  restart: unless-stopped

services:
  db:
    <<: *restart

  api:
    <<: *restart
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set in deploy/.env}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,api,${PUBLIC_HOST:?set in deploy/.env}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_SCHEME:-http}://${PUBLIC_HOST}:${WEB_PORT:-8080},${PUBLIC_SCHEME:-http}://${PUBLIC_HOST}:${STUDENT_PORT:-8081}
      # Signing keys from deploy/.env (one line, "\n" between PEM lines) so they survive rebuilds.
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?set in deploy/.env}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?set in deploy/.env}

  ai:
    <<: *restart
    environment:
      AI_ENV: production

  patient-flow:
    <<: *restart

  notifications:
    <<: *restart

  gateway:
    <<: *restart
    environment:
      ALLOWED_ORIGIN: ${PUBLIC_SCHEME:-http}://${PUBLIC_HOST}:${WEB_PORT:-8080}

  web:
    <<: *restart
    build:
      args:
        VITE_STUDENT_DASHBOARD_URL: ${PUBLIC_SCHEME:-http}://${PUBLIC_HOST}:${STUDENT_PORT:-8081}

  student:
    <<: *restart

  admin-console:
    <<: *restart
    environment:
      APP_KEY: ${ADMIN_APP_KEY:?set in deploy/.env}
      APP_DEBUG: "false"
      APP_URL: ${PUBLIC_SCHEME:-http}://${PUBLIC_HOST}:${ADMIN_PORT:-8082}
