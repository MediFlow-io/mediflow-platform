# MediFlow team: who owns which part of the repo, and what each person is working on.
#
# scripts/team_status.py reads this file and posts a daily status report (see the
# "Team status" issue). To change your task, edit your entry and open a PR.
#
#   areas  = parts of the repo you're responsible for (keys of [areas] below)
#   task   = what you're working on right now, in one line
#   issues = GitHub issue numbers for that task (optional)

maintainer = "gifted-g1"   # the only person who can merge to main
stale_days = 7             # flag people with no activity for this many days
pr_wait_days = 3           # flag PRs waiting this long

# --- Areas: each maps to folders. PRs are labelled and attributed by these paths. ---
[areas.core-api]
title = "Core API (Django)"
paths = ["apps/core-api/"]

[areas.gateway]
title = "Auth gateway (Go)"
paths = ["apps/gateway/"]

[areas.ai-service]
title = "AI service (FastAPI)"
paths = ["apps/ai-service/"]

[areas.patient-flow]
title = "Patient flow (Go): visits, queue, live events"
paths = ["apps/patient-flow/"]

[areas.notifications]
title = "Notifications (Flask)"
paths = ["apps/notifications/", "apps/core-api/apps/notifications/"]

[areas.admin-console]
title = "Admin console (Laravel): audit log, reports, departments"
paths = ["apps/admin-console/"]

[areas.web]
title = "Web client (React)"
paths = ["apps/web/"]

[areas.student-dashboard]
title = "Student dashboard (React)"
paths = ["apps/student-dashboard/"]

[areas.first-aid-ui]
title = "First-aid UI (React)"
paths = ["apps/first-aid-ui/"]

[areas.futa-web]
title = "FUTA staff frontend (legacy JS)"
paths = ["apps/futa-web/"]

[areas.security]
title = "Security"
paths = ["apps/core-api/apps/accounts/", "apps/gateway/jwt.go", "incoming/security-module/"]

[areas.devops]
title = "DevOps & CI"
paths = ["docker-compose.yml", ".github/workflows/", "apps/web/Dockerfile", "apps/web/nginx.conf",
         "apps/core-api/Dockerfile", "apps/gateway/Dockerfile", "apps/ai-service/Dockerfile",
         "apps/patient-flow/Dockerfile", "apps/student-dashboard/Dockerfile", "apps/student-dashboard/nginx.conf",
         "apps/admin-console/Dockerfile", "apps/notifications/Dockerfile", "e2e/"]

[areas.docs]
title = "Documentation"
paths = ["docs/", "README.md", "CONTRIBUTING.md"]

