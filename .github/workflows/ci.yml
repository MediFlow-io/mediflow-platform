name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-api:
    name: Core API (Django)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/core-api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mediflow
          POSTGRES_USER: mediflow
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mediflow" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      POSTGRES_DB: mediflow
      POSTGRES_USER: mediflow
      POSTGRES_PASSWORD: ci-only
      POSTGRES_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/core-api/requirements.txt
      - run: pip install -r requirements.txt
      - name: Migrations are committed
        run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test

  ai-service:
    name: AI service (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/ai-service/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  gateway:
    name: Gateway (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/gateway/go.mod
          cache: false
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...

  patient-flow:
    name: Patient flow (Go)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mediflow_test
          POSTGRES_USER: mediflow
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mediflow" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      POSTGRES_DB: mediflow_test
      POSTGRES_USER: mediflow
      POSTGRES_PASSWORD: ci-only
      POSTGRES_HOST: localhost
      TEST_DATABASE_URL: postgres://mediflow:ci-only@localhost:5432/mediflow_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/core-api/requirements.txt
      - name: Create the schema (owned by the core API's migrations)
        working-directory: apps/core-api
        run: pip install -r requirements.txt && python manage.py migrate --noinput
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/patient-flow/go.mod
          cache-dependency-path: apps/patient-flow/go.sum
      - name: gofmt
        working-directory: apps/patient-flow
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - working-directory: apps/patient-flow
        run: go vet ./...
      - name: Unit + PostgreSQL integration tests
        working-directory: apps/patient-flow
        run: go test -race -count=1 ./...

  admin-console:
    name: Admin console (Laravel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin-console
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Security advisories
        run: composer audit --no-interaction
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test

  node-apps:
    name: Node app (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [web, first-aid-ui, student-dashboard]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm test --if-present
      - run: npm run build

  scripts:
    name: Repo scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: team.toml is valid
        run: python scripts/team_status.py --check-config
      - run: pytest -q scripts/tests

  stack:
    name: Docker stack + browser tests
    needs: [core-api, ai-service, gateway, patient-flow, admin-console, node-apps]
    runs-on: ubuntu-latest
    env:
      # Open all day so the same-day appointment test can run at any hour.
      CLINIC_HOURS: "00:00-23:59"
      CLINIC_DAYS: Sun-Sat
    steps:
      - uses: actions/checkout@v4
      - name: Build and start every service
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Smoke test through Nginx
        run: |
          set -euo pipefail
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/api/health
          # Student dashboard: its own page and API routing
          curl -fsS http://localhost:8081/ | grep -q '<div id="root">'
          curl -fsS http://localhost:8081/api/health
          ACCESS=$(curl -fsS -H 'Content-Type: application/json' \
            -d '{"unique_id":"nurse","password":"nurse123"}' \
            http://localhost:8080/api/auth/login | python3 -c 'import sys,json; print(json.load(sys.stdin)["access"])')
          curl -fsS -H "Authorization: Bearer $ACCESS" -H 'Content-Type: application/json' \
            -d '{"chief_complaint":"chest pain","age_years":40}' http://localhost:8080/api/ai/triage
          # Queue and dashboard are served by the Go patient-flow service through Nginx
          curl -fsS -H "Authorization: Bearer $ACCESS" http://localhost:8080/api/queue
          curl -fsS -H "Authorization: Bearer $ACCESS" http://localhost:8080/api/dashboard | grep -q currentlyWaiting
          # Admin console (Laravel) is up and serves its sign-in page
          curl -fsS http://localhost:8082/up
          curl -fsS http://localhost:8082/login | grep -q 'Admin console'
          # Internal metrics must not be reachable through the public entry point.
          if curl -fsS http://localhost:8080/metrics 2>/dev/null | grep -q '_total'; then
            echo "/metrics is publicly exposed"; exit 1
          fi
          # The AI service must not be reachable from outside the stack.
          if curl -fsS http://localhost:8080/ai/health 2>/dev/null | grep -q model_version; then
            echo "AI service is publicly exposed"; exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Browser tests (Playwright) against the Docker stack
        working-directory: e2e
        env:
          WEB_URL: http://localhost:8080
          STUDENT_URL: http://localhost:8081
          ADMIN_URL: http://localhost:8082
          TZ: Africa/Lagos
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down --volumes
