<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>User management - MediFlow</title>
  <link rel="stylesheet" href="public style.css">
</head>
<body class="app-shell">
  <script src="homepage.js"></script>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">⚙</span><div><strong>MediFlow</strong><span>FUTA Health Centre</span></div></div>
    <div class="topbar-actions">
      <span class="staff-name">User</span>
      <button id="logoutButton" class="logout-button" type="button">Log out</button>
    </div>
  </header>

  <div class="app-layout">
    <aside class="sidebar" aria-label="Primary navigation">
      <nav>
        <a class="nav-item" href="dashboard.html"><span>▦</span> Queue overview</a>
        <a class="nav-item" href="patient-form.html"><span>＋</span> Register patient</a>
        <a class="nav-item active" href="user-management.html"><span>⚙</span> User management</a>
      </nav>
      <div class="sidebar-footer"><span class="help-icon">?</span><div><strong>Need help?</strong><small>Contact IT support</small></div></div>
    </aside>

    <main class="main-content">
      <div class="page-heading dashboard-heading">
        <div>
          <p class="eyebrow">User & permissions</p>
          <h1>Manage demo users</h1>
          <p class="muted">Only visible in demo mode — persistent in your browser's local storage.</p>
        </div>
      </div>

      <div id="message" class="message"></div>

      <section class="queue-panel">
        <h2>Existing users</h2>
        <div id="usersList"></div>
        <hr>
        <h2>Create new user</h2>
        <form id="createUserForm" class="form-card" style="max-width:520px">
          <label>Username<input id="newUsername" required></label>
          <label>Password<input id="newPassword" type="password" required></label>
          <label>Display name<input id="newDisplayName"></label>
          <label>Role<select id="newRole"><option value="admin">Admin</option><option value="doctor">Doctor</option><option value="nurse">Nurse</option></select></label>
          <div style="margin-top:12px"><button class="button" type="submit">Create user</button></div>
        </form>
      </section>
    </main>
  </div>

  <script src="js/user-management.js"></script>
</body>
</html>
