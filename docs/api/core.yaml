openapi: 3.0.3
info:
  title: MediFlow Core API — patients, visits, queue, dashboard, staff
  version: "1.1"
  description: |
    Django core API. Every route needs a JWT bearer token or a session, unless marked otherwise.
    Roles and permissions are listed per operation. Auth routes live in auth.yaml; AI routes in ai.yaml.
    Every read or write of an identifiable patient record is written to the audit log (search text is not stored).

    Served by two services behind one origin (ADR-0002): /api/visits*, /api/queue* and /api/dashboard come from
    the Go patient-flow service (apps/patient-flow); everything else from Django (apps/core-api).
servers:
  - url: /
security: [{bearer: []}, {session: []}]
paths:
  /api/patients:
    get:
      summary: List/search patients (admin, doctor, nurse, reception, lab, pharmacy)
      parameters:
        - {name: search, in: query, schema: {type: string}, description: Name, hospital number or phone}
      responses:
        "200": {description: Patients, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Patient"}}}}}
        "403": {$ref: "#/components/responses/Error"}
    post:
      summary: Register a patient (admin, doctor, nurse, reception)
      requestBody: {content: {application/json: {schema: {$ref: "#/components/schemas/Patient"}}}}
      responses:
        "201": {description: Created}
        "400": {$ref: "#/components/responses/Error"}
  /api/patients/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
    get: {summary: One patient (audited), responses: {"200": {description: Patient}}}
    patch:
      summary: Update a patient (admin, doctor, reception). `linkedAccount` links/unlinks a login account.
      responses: {"200": {description: Updated}, "400": {$ref: "#/components/responses/Error"}}
    delete: {summary: Delete a patient (admin, doctor, reception), responses: {"204": {description: Deleted}}}
  /api/visits:
    get:
      summary: List visits (check-ins)
      parameters:
        - {name: status, in: query, schema: {type: string}, example: "waiting,called"}
        - {name: department, in: query, schema: {type: string}, example: opd}
        - {name: patient, in: query, schema: {type: integer}}
        - {name: today, in: query, schema: {type: boolean}}
      responses: {"200": {description: Visits, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Visit"}}}}}}
    post:
      summary: Check a patient in (admin, doctor, nurse, reception). A patient can have only one active visit.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [patient, department, esi]
              properties:
                patient: {type: integer}
                department: {type: integer}
                esi: {type: integer, minimum: 1, maximum: 5}
                arrival_mode: {type: string, example: walk_in}
                chief_complaint: {type: string, maxLength: 500, description: Saved with the visit (not written to the audit log)}
                pain_score: {type: integer, minimum: 0, maximum: 10, nullable: true}
                vitals: {$ref: "#/components/schemas/Vitals"}
      responses: {"201": {description: Checked in}, "400": {$ref: "#/components/responses/Error"}}
  /api/visits/{id}/triage:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
    post:
      summary: Escalate or de-escalate a waiting or called patient (admin, doctor, nurse)
      description: |
        Body `{esi, reason}`; the reason is required and kept in the visit's triage history, not in the
        audit log (which records `visit.triage_changed` with from/to levels only). An ESI change through
        `PATCH /api/visits/{id}` (optional `esi_reason`) is recorded the same way. 409 once the
        consultation has started.
      responses: {"200": {description: The updated visit}, "400": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}, "409": {description: Not waiting or called}}
    get:
      summary: The visit's triage changes, oldest first
      responses: {"200": {description: "[{from_esi, to_esi, direction, reason, changed_by, changed_at}]"}}
  /api/visits/{id}/{action}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
      - {name: action, in: path, required: true, schema: {type: string, enum: [call, start, complete, cancel]}}
    post:
      summary: Move a visit through the patient flow. The only way to change `status`.
      description: |
        | action | from | to | roles |
        |---|---|---|---|
        | call | waiting | called | admin, doctor, nurse, reception |
        | start | waiting, called | in_progress | admin, doctor, nurse (assigns the clinician) |
        | complete | in_progress | completed | admin, doctor, nurse |
        | cancel | waiting, called, in_progress | cancelled | admin, doctor, nurse, reception |
        Runs in a transaction with a row lock, so two people cannot apply conflicting actions.
      responses:
        "200": {description: Updated visit, content: {application/json: {schema: {$ref: "#/components/schemas/Visit"}}}}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {description: Not allowed from the current status}
  /api/queue:
    get:
      summary: Waiting patients, ESI first then arrival (admin, doctor, nurse, reception, lab, pharmacy)
      parameters: [{name: department, in: query, schema: {type: string}}]
      responses:
        "200":
          description: Queue
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: {type: integer}
                    visitId: {type: string}
                    fullName: {type: string}
                    hospitalNumber: {type: string}
                    department: {type: string}
                    priority: {type: integer}
                    position: {type: integer}
                    waitingMinutes: {type: integer, description: Time actually waited so far}
                    chiefComplaint: {type: string}
                    wait: {type: string, example: "12 min"}
                    aheadInDepartment: {type: integer, description: People ahead in the same department}
                    estimatedWaitMinutes:
                      type: integer
                      nullable: true
                      description: |
                        Rough minutes until called: people ahead × mean consultation time over 7 days
                        (default 15, kept within 3–120) ÷ clinicians working (in consultation now, or
                        doctors rostered now, at least 1). Null when it can't be computed.
                    targetMinutes: {type: integer, description: The ESI level's target from clinic settings}
                    overTarget: {type: boolean}
  /api/queue/me:
    get:
      summary: The caller's own place in the queue (patients)
      responses:
        "200":
          description: "{linked, active, status, department, ahead, estimatedWaitMinutes}"
  /api/queue/events:
    get:
      summary: Live queue changes as server-sent events (same roles as /api/queue). Served by Go.
      description: |
        `event: visit` with data `{"visitId", "action", "status", "department"}` after every committed
        check-in, edit or lifecycle action; `: ping` comments keep the connection alive. Clients refetch
        /api/queue on each event. Send the bearer token in the Authorization header (fetch + stream
        reader), never in the URL.
      responses:
        "200": {description: Event stream, content: {text/event-stream: {}}}
  /api/dashboard:
    get:
      summary: Today's metrics from visit records (all staff)
      responses:
        "200":
          description: Metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  patientsToday: {type: integer}
                  currentlyWaiting: {type: integer}
                  inConsultation: {type: integer}
                  completedToday: {type: integer}
                  emergencyCases: {type: integer, description: Waiting with ESI 1–2}
                  averageWaitMinutes: {type: integer, nullable: true, description: Check-in to called/started, today}
                  longestCurrentWaitMinutes: {type: integer, nullable: true}
                  byDepartment: {type: array, items: {type: object}}
                  byStatus: {type: object, additionalProperties: {type: integer}}
                  overTarget: {type: integer, description: Waiting longer than their ESI target}
                  longWaits: {type: integer, description: Waiting longer than longWaitMinutes}
                  longWaitMinutes: {type: integer}
                  departmentLoad:
                    type: array
                    items:
                      type: object
                      properties:
                        name: {type: string}
                        waiting: {type: integer}
                        inConsultation: {type: integer}
                        longestWaitMinutes: {type: integer}
                        overTarget: {type: integer}
                        longWaits: {type: integer}
  /api/reports/flow:
    get:
      summary: Multi-day flow report (admin only). Served by Go. Used by the admin console.
      parameters:
        - {name: from, in: query, schema: {type: string, format: date}, description: "Default: 6 days before `to`"}
        - {name: to, in: query, schema: {type: string, format: date}, description: "Default: today. Max range 92 days"}
      responses:
        "200":
          description: Totals plus per-day (every day listed), per-department and per-ESI rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  from: {type: string}
                  to: {type: string}
                  timeZone: {type: string, example: Africa/Lagos}
                  totals: {$ref: "#/components/schemas/FlowStats"}
                  days: {type: array, items: {allOf: [{$ref: "#/components/schemas/FlowStats"}, {properties: {date: {type: string}}}]}}
                  byDepartment: {type: array, items: {allOf: [{$ref: "#/components/schemas/FlowStats"}, {properties: {department: {type: string}}}]}}
                  byEsi: {type: array, items: {allOf: [{$ref: "#/components/schemas/FlowStats"}, {properties: {esi: {type: integer}}}]}}
                  byHour: {type: array, description: "24 rows, by local check-in hour", items: {allOf: [{$ref: "#/components/schemas/FlowStats"}, {properties: {hour: {type: integer}}}]}}
                  byWeekday: {type: array, description: "7 rows, 0 = Sunday", items: {allOf: [{$ref: "#/components/schemas/FlowStats"}, {properties: {weekday: {type: integer}, day: {type: string}}}]}}
                  byClinician: {type: array, description: "Assigned clinician, most completed first", items: {allOf: [{$ref: "#/components/schemas/FlowStats"}, {properties: {clinician: {type: string}}}]}}
                  targetMinutes: {type: object, additionalProperties: {type: integer}, description: "ESI level → target used for seenWithinTargetPercent"}
        "400": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /api/audit-logs:
    get:
      summary: Read the shared audit log (admin only). Served by Django. Viewing is itself audited.
      parameters:
        - {name: action, in: query, schema: {type: string}, description: Prefix match, e.g. "patient."}
        - {name: actor, in: query, schema: {type: string}, description: Username}
        - {name: entity_type, in: query, schema: {type: string}}
        - {name: entity_id, in: query, schema: {type: string}}
        - {name: since, in: query, schema: {type: string, format: date}}
        - {name: until, in: query, schema: {type: string, format: date}, description: Inclusive}
        - {name: page, in: query, schema: {type: integer}}
        - {name: page_size, in: query, schema: {type: integer, maximum: 200, default: 50}}
      responses:
        "200":
          description: Newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: {type: integer}
                  next: {type: string, nullable: true}
                  previous: {type: string, nullable: true}
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: integer}
                        created_at: {type: string, format: date-time}
                        actor: {type: string, nullable: true}
                        actor_role: {type: string, nullable: true}
                        action: {type: string, example: patient.viewed}
                        entity_type: {type: string}
                        entity_id: {type: string}
                        details: {type: object}
        "400": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /api/appointments:
    get:
      summary: All appointments (admin, doctor, nurse, reception). Served by Go.
      parameters:
        - {name: status, in: query, schema: {type: string}, example: "requested,confirmed"}
        - {name: date, in: query, schema: {type: string, format: date}, description: Hospital-local day}
        - {name: department, in: query, schema: {type: string}}
        - {name: patient, in: query, schema: {type: integer}}
      responses: {"200": {description: Appointments, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Appointment"}}}}}}
    post:
      summary: Request (a patient, for their own linked record) or book (staff, for any patient; confirmed at once)
      description: |
        Slots must be in clinic hours (CLINIC_HOURS / CLINIC_DAYS, default Mon-Fri 08:00-16:00), on a 15-minute
        boundary, at least 15 minutes ahead and at most 60 days ahead. A patient may hold at most 3 open
        (requested or confirmed) appointments.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [department, date, time]
              properties:
                patient: {type: integer, description: Staff only. Ignored for patients (their own record is used)}
                department: {type: integer}
                date: {type: string, format: date, description: Hospital-local}
                time: {type: string, example: "09:30"}
                reason: {type: string, maxLength: 300}
      responses: {"201": {description: Created}, "400": {$ref: "#/components/responses/Error"}}
  /api/appointments/mine:
    get:
      summary: The caller's own appointments, newest first, plus the clinic's bookable hours
      responses:
        "200":
          description: "{linked, schedule, holidays: [{date, name}], appointments}"
  /api/appointments/{id}/{action}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
      - {name: action, in: path, required: true, schema: {type: string, enum: [confirm, decline, cancel, check_in]}}
    post:
      summary: Move an appointment through its lifecycle
      description: |
        | action | from | who | body |
        |---|---|---|---|
        | confirm | requested | staff | optional `date`+`time` (reschedule), `note` |
        | decline | requested | staff | `note` (required, shown to the patient) |
        | cancel | requested, confirmed | staff, or the patient for their own | optional `note` |
        | check_in | confirmed | staff, on the appointment's day | `esi`, optional `chief_complaint`, `pain_score`, `vitals` |
        Check-in creates the visit in the same transaction. Another patient's appointment returns 404.
      responses: {"200": {description: Updated}, "400": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}, "409": {description: Not allowed from the current status}}
  /api/notifications:
    get:
      summary: The caller's own notifications, newest first (Flask notification service)
      description: |
        Created from patient-flow events and scheduled checks: "You've been called", "You're checked in",
        "You're next", "Your turn is near", appointment booked/confirmed/declined/cancelled and reminders,
        long-wait notices for patients; new requests and patient cancellations for front-desk staff
        (admin, doctor, nurse, reception); urgent (ESI 1–2) arrivals and escalations for doctors and nurses.
        `link` is home, appointments or queue.
      parameters:
        - {name: unread, in: query, schema: {type: string, enum: ["1", "true"]}, description: Only unread}
        - {name: limit, in: query, schema: {type: integer, default: 30, maximum: 100}}
        - {name: before, in: query, schema: {type: integer}, description: "Paging: ids lower than this"}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  results: {type: array, items: {$ref: "#/components/schemas/Notification"}}
                  unread: {type: integer}
        "401": {$ref: "#/components/responses/Error"}
  /api/notifications/unread-count:
    get:
      summary: Number of unread notifications, for the bell
      responses: {"200": {description: "{unread}"}, "401": {$ref: "#/components/responses/Error"}}
  /api/notifications/{id}/read:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
    post:
      summary: Mark one notification read. Someone else's returns 404.
      responses: {"200": {description: "{unread}"}, "401": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}}
  /api/notifications/preferences:
    get:
      summary: The caller's delivery preferences
      responses: {"200": {description: "{in_app: true, email, sms}"}}
    put:
      summary: "Turn email and/or SMS on or off, e.g. {\"sms\": false}. In-app can't be turned off"
      responses: {"200": {description: Saved}, "400": {$ref: "#/components/responses/Error"}}
  /api/notifications/read-all:
    post:
      summary: Mark all of the caller's notifications read
      responses: {"200": {description: "{updated, unread}"}, "401": {$ref: "#/components/responses/Error"}}
  /api/clinic/settings:
    get:
      summary: Clinic settings in one call (any signed-in user)
      description: |
        `{queue, hours, holidays}` and, for staff, `onDutyNow` (staff on shift right now, counted by role).
        Weekdays are 0 = Sunday … 6 = Saturday. Hours with `department: null` are the clinic default; a
        department with its own rows uses those instead. A weekday with no row is closed. Until any hours
        are saved, patient-flow uses CLINIC_HOURS / CLINIC_DAYS. Only upcoming holidays are listed.
      responses: {"200": {description: OK}, "401": {$ref: "#/components/responses/Error"}}
  /api/clinic/queue-settings:
    get:
      summary: ESI target minutes, long-wait threshold, "turn is near" threshold, booking rules
      responses: {"200": {description: OK}}
    put:
      summary: Change any subset (admin). Audited as settings.queue_updated
      description: |
        Fields: `esi1_target_minutes` … `esi5_target_minutes`, `long_wait_minutes`, `turn_near_ahead`,
        `slot_minutes` (must divide a day), `max_days_ahead`, `min_notice_minutes`, `max_open_appointments`.
      responses: {"200": {description: Saved}, "400": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}}
  /api/clinic/hours:
    get:
      summary: All service hours
      responses: {"200": {description: "[{department, weekday, day, opens, closes}]"}}
    put:
      summary: "Replace a department's week (admin); `department: null` is the clinic default; `days: []` removes a department's own hours"
      requestBody:
        content:
          application/json:
            example: {department: null, days: [{weekday: 1, opens: "08:00", closes: "16:00"}]}
      responses: {"200": {description: Saved}, "400": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}}
  /api/clinic/holidays:
    get:
      summary: Holidays (`?upcoming=1` for today onwards)
      responses: {"200": {description: "[{id, date, name}]"}}
    post:
      summary: Add a holiday (admin). No appointments can be booked on it
      responses: {"201": {description: Created}, "400": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}}
  /api/clinic/holidays/{id}:
    delete:
      summary: Remove a holiday (admin)
      responses: {"204": {description: Removed}}
  /api/clinic/shifts:
    get:
      summary: Staff shifts (staff only); filters `?department=` `?user=` `?weekday=`
      responses: {"200": {description: "[{id, user, user_name, role, department, department_name, weekday, day, starts, ends}]"}}
    post:
      summary: Add a shift for an active staff member (admin)
      responses: {"201": {description: Created}, "400": {$ref: "#/components/responses/Error"}}
  /api/clinic/shifts/{id}:
    patch:
      summary: Change a shift (admin)
      responses: {"200": {description: Saved}}
    delete:
      summary: Remove a shift (admin)
      responses: {"204": {description: Removed}}
  /api/me/health:
    get:
      summary: The caller's own linked record (e.g. a student). Excludes diagnosis, treatment and internal notes.
      responses:
        "200":
          description: Own record, or linked=false
          content:
            application/json:
              schema:
                type: object
                properties:
                  linked: {type: boolean}
                  patient: {type: object, nullable: true}
                  activeVisit:
                    type: object
                    nullable: true
                    properties:
                      visitNumber: {type: string}
                      department: {type: string}
                      status: {type: string, enum: [waiting, called, in_progress]}
                      patientsAhead: {type: integer, nullable: true}
                  latestVitals:
                    type: object
                    nullable: true
                    description: Most recent recorded vital signs (numbers only; the complaint text is not shown to patients)
                    properties:
                      recordedAt: {type: string, format: date-time}
                      heartRate: {type: integer, nullable: true}
                      respRate: {type: integer, nullable: true}
                      spo2: {type: integer, nullable: true}
                      temperatureC: {type: number, nullable: true}
                      systolicBp: {type: integer, nullable: true}
                      painScore: {type: integer, nullable: true}
                  visits: {type: array, items: {type: object}}
  /api/users:
    get:
      summary: Staff accounts (admin only)
      parameters:
        - {name: role, in: query, schema: {type: string}}
        - {name: active, in: query, schema: {type: boolean}}
        - {name: search, in: query, schema: {type: string}}
      responses: {"200": {description: Users}}
    post:
      summary: Create an account (admin only). Password must pass the password rules.
      responses: {"201": {description: Created}, "400": {$ref: "#/components/responses/Error"}}
  /api/users/{id}:
    patch:
      summary: Update role, details, is_active or password (admin only). Deactivating signs the user out everywhere. There is no DELETE.
      responses: {"200": {description: Updated}, "400": {$ref: "#/components/responses/Error"}}
  /api/departments:
    get: {summary: Departments (any signed-in user), responses: {"200": {description: Departments}}}
    post: {summary: Create a department (admin only), responses: {"201": {description: Created}}}
components:
  securitySchemes:
    bearer: {type: http, scheme: bearer, bearerFormat: JWT}
    session: {type: apiKey, in: cookie, name: sessionid}
  responses:
    Error:
      description: Error
      content: {application/json: {schema: {type: object, properties: {detail: {type: string}}}}}
  schemas:
    Notification:
      type: object
      properties:
        id: {type: integer}
        kind: {type: string, example: visit.called}
        title: {type: string, example: "You've been called"}
        body: {type: string, example: Please go to Outpatient Department now.}
        link: {type: string, enum: [home, appointments, queue], description: Which page the app should open}
        createdAt: {type: string, format: date-time}
        readAt: {type: string, format: date-time, nullable: true}
    Appointment:
      type: object
      properties:
        id: {type: integer}
        reference: {type: string, example: A-1A2B3C4D}
        patient: {type: integer}
        patient_name: {type: string}
        department: {type: integer}
        department_name: {type: string}
        scheduled_for: {type: string, format: date-time}
        date: {type: string, format: date}
        time: {type: string, example: "09:30"}
        reason: {type: string}
        status: {type: string, enum: [requested, confirmed, declined, cancelled, checked_in]}
        staff_note: {type: string}
        requested_by: {type: string, nullable: true, description: Hidden from patients}
        handled_by: {type: string, nullable: true, description: Hidden from patients}
        visit: {type: integer, nullable: true}
    FlowStats:
      type: object
      properties:
        checkIns: {type: integer}
        completed: {type: integer}
        cancelled: {type: integer}
        averageWaitMinutes: {type: integer, nullable: true, description: Check-in to called/started}
        averageConsultationMinutes: {type: integer, nullable: true, description: Started to completed}
        averageCallToStartMinutes: {type: integer, nullable: true, description: Called to started}
        seenWithinTargetPercent: {type: integer, nullable: true, description: "Share seen within their ESI target (0–100)"}
    Patient:
      type: object
      required: [fullName, sex, phone]
      properties:
        id: {type: integer, readOnly: true}
        hospitalNumber: {type: string, readOnly: true}
        fullName: {type: string}
        dateOfBirth: {type: string, format: date, nullable: true}
        sex: {type: string, enum: [Male, Female, Other]}
        phone: {type: string}
        address: {type: string}
        nextOfKin: {type: string}
        nextOfKinPhone: {type: string}
        allergies: {type: string}
        medicalHistory: {type: string}
        complaint: {type: string}
        diagnosis: {type: string}
        treatment: {type: string}
        notes: {type: string}
        linkedAccount: {type: string, writeOnly: true, description: "Username to link; empty string unlinks"}
        linkedAccountName: {type: string, readOnly: true, nullable: true}
    Visit:
      type: object
      properties:
        id: {type: integer}
        visit_number: {type: string}
        patient: {type: integer}
        patient_name: {type: string}
        department: {type: integer}
        department_code: {type: string}
        department_name: {type: string}
        esi: {type: integer}
        status: {type: string, enum: [waiting, called, in_progress, completed, cancelled], readOnly: true}
        checked_in_at: {type: string, format: date-time}
        called_at: {type: string, format: date-time, nullable: true}
        started_at: {type: string, format: date-time, nullable: true}
        completed_at: {type: string, format: date-time, nullable: true}
