<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - FUTA Hospital Management System</title>
  <link rel="stylesheet" href="public style.css">
</head>
<body class="auth-page">
  <script src="homepage.js"></script>

  <header class="topbar">
    <h2>FUTA Hospital Management System</h2>
    <nav>
      <a href="index.html">Home</a>
      <button type="button" class="theme-toggle" aria-label="Toggle dark mode">
        <span class="theme-icon" aria-hidden="true">🌙</span>
        <span class="theme-text">Dark mode</span>
      </button>
    </nav>
  </header>

  <main class="auth-container">
    <form id="loginForm" class="form-card">
      <h1>Staff Login</h1>
      <p class="muted">Sign in to continue</p>

      <div id="message" class="message"></div>

      <label for="staffId">Staff ID</label>
      <input
        type="text"
        id="staffId"
        placeholder="Enter staff ID"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Enter password"
        required
      >

      <button class="button full-width" type="submit">
        Login
      </button>

      <p class="demo-login">
        Demo login: <strong>admin</strong> / <strong>admin123</strong>
      </p>
    </form>
  </main>

  <footer>
    &copy; 2026 FUTA Hospital Management System
  </footer>

  <script src="js/login.js"></script>
</body>
</html>
