# Student dashboard entry point. Same API routing as apps/web; the AI service is never routed here.
server {
    listen 80;
    server_tokens off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 15s;

    # Auth goes through the Go gateway (JWT + role checks at the edge).
    location /api/auth/ {
        proxy_pass http://gateway:8080;
    }

    # Visits, queue and flow dashboard belong to the Go patient-flow service (ADR-0002).
    location = /api/queue/events {
        proxy_pass http://patient-flow:8090;
        proxy_buffering off;          # live server-sent events
        proxy_read_timeout 1h;
    }
    location ~ ^/api/(visits|queue|dashboard)(/|$) {
        proxy_pass http://patient-flow:8090;
    }

    # Everything else under /api goes to Django, which enforces auth and RBAC.
    location /api/ {
        proxy_pass http://api:8000;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    root /usr/share/nginx/html;
    location / {
        try_files $uri /index.html;
    }
}
