# Template: the nginx image fills in ${API_URL}, ${GATEWAY_URL}, ${FLOW_URL} and ${NOTIFY_URL} at start.
# Public entry point. The AI service is deliberately NOT routed here: only Django may call it.
server {
    listen ${PORT};
    server_tokens off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # Only this origin's scripts may run, so injected script can't read the tokens in localStorage.
    # Inline styles are allowed (React style attributes); Google Fonts serves the staff app's font.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # The upstream's own host name: hosts like Render route by it. The original host is in X-Forwarded-Host.
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_ssl_server_name on;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout ${PROXY_TIMEOUT};

    # Auth goes through the Go gateway (JWT + role checks at the edge).
    location /api/auth/ {
        proxy_pass ${GATEWAY_URL};
    }

    # Visits, queue and flow dashboard belong to the Go patient-flow service (ADR-0002).
    location = /api/queue/events {
        proxy_pass ${FLOW_URL};
        proxy_buffering off;          # live server-sent events
        proxy_read_timeout 1h;
    }
    location ~ ^/api/(visits|queue|dashboard|reports|appointments)(/|$) {
        proxy_pass ${FLOW_URL};
    }

    # Notifications belong to the Flask notification service (ADR-0002).
    location ~ ^/api/notifications(/|$) {
        proxy_pass ${NOTIFY_URL};
    }

    # Everything else under /api goes to Django, which enforces auth and RBAC.
    location /api/ {
        proxy_pass ${API_URL};
    }

    # Health checks that wake the backends. Free hosting puts idle services to sleep, so the page calls
    # these as soon as it opens; by the time someone signs in, the services are up.
    location = /wake/gateway {
        access_log off;
        proxy_pass ${GATEWAY_URL}/healthz;
    }
    location = /wake/flow {
        access_log off;
        proxy_pass ${FLOW_URL}/healthz;
    }
    location = /wake/notify {
        access_log off;
        proxy_pass ${NOTIFY_URL}/healthz;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    root /usr/share/nginx/html;
    location / {
        try_files $uri /index.html;
    }
}
